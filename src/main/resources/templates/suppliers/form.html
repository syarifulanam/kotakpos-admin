<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head>
    <title th:text="${supplier.id == null ? 'New Supplier' : 'Edit Supplier'}">Supplier Form</title>
</head>
<body>
<div layout:fragment="content">
    <div class="container-fluid py-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <!--                Header-->
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h2 class="fw-bold mb-1"
                            th:text="${supplier.id == null ? 'add a new supplier' : 'update supplier information'}">
                            Supplier
                            Form</h2>
                        <p class="text-muted mb-0">Fill in the details below to <span
                                th:text="${supplier.id == null ? 'add a new supplier' : 'updated supplier information'}"></span>.
                        </p>
                    </div>
                    <a th:href="@{/suppliers}" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left me-2"></i>Back to list
                    </a>
                </div>

                <!--                Form Card-->
                <div class="card border-0 shadow-sm">
                    <div class="card-body py-4">
                        <form th:action="${supplier.id == null} ? @{/suppliers} : @{/suppliers/update/{id}(id=${supplier.id})}"
                              th:object="${supplier}" method="post">

                            <div class="row mb-4">
                                <div class="col-md-12">
                                    <h5 class="text-primary mb-3">Basic Information</h5>
                                </div>
                                <div class="col-md-12 mb-3">
                                    <label for="name" class="form-label fw-bold">Supplier Name</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light"><i
                                                class="bi bi-building text-muted"></i></span>
                                        <input type="text" class="form-control" id="name" th:field="*{name}"
                                               placeholder="e.g. Acme Corp" required>
                                    </div>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="phone" class="form-label fw-bold">Phone Number</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light"><i
                                                class="bi bi-telephone text-muted"></i></span>
                                        <input type="text" class="form-control" id="phone" th:field="*{phone}"
                                               placeholder="e.g. +1 234 567 890">
                                    </div>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="email" class="form-label fw-bold">Email Address</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light"><i
                                                class="bi bi-envelope text-muted"></i></span>
                                        <input type="email" class="form-control" id="email" th:field="*{email}"
                                               placeholder="e.g. contact@acme.com">
                                    </div>
                                </div>
                            </div>

                            <div class="row mb-4">
                                <div class="col-md-12">
                                    <h5 class="text-primary mb-3">Address Details</h5>
                                </div>
                                <div class="col-md-12 mb-3">
                                    <label for="address" class="form-label fw-bold">Street Address</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light"><i class="bi bi-geo-alt text-muted"></i></span>
                                        <textarea class="form-control" id="address" th:field="*{address}" rows="2"
                                                  placeholder="Enter street address"></textarea>
                                    </div>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label for="city" class="form-label fw-bold">City</label>
                                    <input type="text" class="form-control" id="city" th:field="*{city}"
                                           placeholder="City">
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label for="postalCode" class="form-label fw-bold">Postal Code</label>
                                    <input type="text" class="form-control" id="postalCode" th:field="*{postalCode}"
                                           placeholder="Zip Code">
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label for="country" class="form-label fw-bold">Country</label>
                                    <input type="text" class="form-control" id="country" th:field="*{country}"
                                           placeholder="Country">
                                </div>
                            </div>

                            <div class="row mb-4">
                                <div class="col-md-12 mb-3">
                                    <label for="notes" class="form-label fw-bold">Notes</label>
                                    <textarea class="form-control" id="notes" th:field="*{notes}" rows="3"
                                    placeholder="Any additional notes about the supplier..."></textarea>
                                </div>
                            </div>

                            <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                                <a th:href="@{/suppliers}" class="btn btn-light border">Cancel</a>
                                <button type="submit" class="btn btn-primary px-4">
                                    <i class="bi bi-check-lg me-2"></i>Save Supplier
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
