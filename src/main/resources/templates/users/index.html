<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head>
    <title>Users Management</title>
</head>
<body>
<div layout:fragment="content">
    <!--    Header-->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold mb-1">Users Management</h2>
            <p class="text-muted mb-0">Manage your system users and their roles.</p>
        </div>
        <a th:href="@{/users/create}" class="btn btn-primary shadow-sm">
            <i class="bi bi-person-plus me-2"></i>Add New User
        </a>
    </div>

    <!--    Main Card-->
    <div class="card border-0 shadow-sm">

        <!--        Search Form-->
        <form th:action="@{/users}" method="GET" class="mb-4">
            <div class="row g-3">
                <div class="col-md-3">
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i
                                class="bi bi-search text-muted"></i></span>
                        <input type="text" name="name" class="form-control border-start-0 bg-light"
                               placeholder="Search by name.." th:value="${name}">
                    </div>
                </div>

                <div class="col-md-3">
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i
                                class="bi bi-envelope text-muted"></i></span>
                        <input type="text" name="email" class="form-control border-start-0 bg-light"
                               placeholder="Search by email..." th:value="${email}">
                    </div>
                </div>

                <div class="col-md-2">
                    <select name="role" class="form-select bg-light">
                        <option value="">All Roles</option>
                        <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"
                                th:selected="${r == role}"></option>
                    </select>
                </div>

                <div class="col-md-2">
                    <select name="status" class="form-select bg-light">
                        <option value="">All Statuses</option>
                        <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"
                                th:selected="${s == status}"></option>
                    </select>
                </div>

                <div class="col-md-1">
                    <button class="btn btn-dark w-100" type="submit">Filter</button>
                </div>
                <div class="col-md-1">
                    <a th:href="@{/users}" class="btn btn-outline-secondary w-100">Reset</a>
                </div>
            </div>
        </form>

        <!--    Users Table-->
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="bg-light text-uppercase text-muted small">
                <tr>
                    <th class="border-0 py-3 ps-4">
                        <a th:href="@{/users(sortDir=${sortDir == 'asc' ? 'desc' : 'asc'}, sortBy='name')}"
                           class="text-decoration-none text-muted">User
                            <i th:if="${sortBy == 'name' || sortDir != null}"
                               th:class="${sortDir == 'asc' ? 'bi-sort-alpha-down' : 'bi-sort-alpha-up'}"></i>
                        </a>
                    </th>
                    <th class="border-0 py-3">
                        <a th:href="@{/users(sortDir=${sortDir == 'asc' ? 'desc' : 'asc'}, sortBy='role')}"
                           class="text-decoration-none text-muted">Role
                            <i th:if="${sortBy == 'role' || sortDir != null}"
                               th:class="${sortDir == 'asc' ? 'bi-sort-alpha-down' : 'bi-sort-alpha-up'}"></i>
                        </a>
                    </th>
                    <th class="border-0 py-3">
                        <a th:href="@{/users(sortDir=${sortDir == 'asc' ? 'desc' : 'asc'}, sortBy='status')}"
                           class="text-decoration-none text-muted">Status
                            <i th:if="${sortBy == 'status' || sortDir != null}"
                               th:class="${sortDir == 'asc' ? 'bi-sort-alpha-down' : 'bi-sort-alpha-up'}"></i>
                        </a>
                    </th>
                    <th class="border-0 py-3 text-end pe-4">Action</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="user : ${users.content}">
                    <td class="ps-4">
                        <div class="d-flex align-items-center">

                            <div class="me-3 bg-primary text-white rounded-circle d-flex align-items-center justify-content-center"
                                 style="width:40px; height:40px;">
                                <span class="fw-bold text-uppercase"
                                      th:text="${user.name != null ? #strings.substring(user.name,0,1) : 'U'}">U</span>
                            </div>
                            <div class="d-flex flex-column">
                                <span class="fw-bold" th:text="${user.name}">User Name</span>
                                <small class="text-muted" th:text="${user.email}">user@example.com</small>
                            </div>

                        </div>
                    </td>
                    <td>
                        <span class="badge bg-light text-dark border" th:text="${user.role}">ROLE</span>
                    </td>
                    <td>
                    <span th:switch="${user.status.name()}" class="badge rounded-pill"
                          th:classappend="${user.status.name() == 'ACTIVE' ? 'bg-success-subtle text-success' : (user.status.name() == 'INACTIVE' ? 'bg-warning-subtle text-warning' : 'bg-danger-subtle text-danger')}">
                        <i class="bi bi-dot me-1"></i>
                        <span th:text="${user.status}">ACTIVE</span>
                    </span>
                    </td>
                    <td class="text-end pe-4">
                        <div class="btn-group">
                            <a th:href="@{/users/reset-password/{id}(id=${user.id})}"
                               class="btn btn-sm btn-light text-muted" title="Reset Password"
                               data-bs-toggle="tooltip">
                                <i class="bi bi-key"></i>
                            </a>
                            <a th:href="@{/users/edit/{id}(id=${user.id})}"
                               class="btn btn-sm btn-light text-primary" title="Edit" data-bs-toggle="tooltip">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <button type="button" class="btn btn-sm btn-light text-danger" title="Delete"
                                    data-bs-toggle="modal" data-bs-target="#deleteModal"
                                    th:data-id="${user.id}" th:data-name="${user.name}">
                                <i class="bi bi-trash"></i>
                            </button>
                        </div>
                    </td>
                </tr>
                <tr th:if="${users.empty}">
                    <td colspan="4" class="text-center py-5 text-muted">
                        <i class="bi bi-people display-4 mb-3 d-block"></i>
                        No users found matching your criteria.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <!--        Pagination-->
        <div class="d-flex justify-content-between align-items-center mt-4" th:if="${users.totalPages > 1}">

            <small class="text-muted">
                Showing <span th:text="${users.numberOfElements}">0</span> of
                <span th:text="${users.totalElements}">0</span> users
            </small>

            <nav>
                <ul class="pagination pagination-sm mb-0">
                    <li class="page-item" th:classappend="${users.first} ? 'disabled'">
                        <a class="page-link border-0"
                           th:href="@{/users(page=${users.number - 1}, size=${users.size}, name=${name}, email=${email}, role=${role}, status=${status}, sortBy=${sortBy}, sortDir=${sortDir})}">
                            <i class="bi bi-chevron-left"></i>
                        </a>
                    </li>

                    <li class="page-item"
                        th:each="i : ${#numbers.sequence(0, users.totalPages - 1)}"
                        th:classappend="${users.number == i} ? 'active'">

                        <a class="page-link border-0 rounded-circle mx-1"
                           th:href="@{/users(page=${i}, size=${users.size}, name=${name}, email=${email}, role=${role}, status=${status}, sortBy=${sortBy}, sortDir=${sortDir})}"
                           th:text="${i + 1}">
                        </a>
                    </li>

                    <li class="page-item" th:classappend="${users.last} ? 'disabled'">
                        <a class="page-link border-0"
                           th:href="@{/users(page=${users.number + 1}, size=${users.size}, name=${name}, email=${email}, role=${role}, status=${status}, sortBy=${sortBy}, sortDir=${sortDir})}">
                            <i class="bi bi-chevron-right"></i>
                        </a>
                    </li>

                </ul>
            </nav>
        </div>
    </div>
</body>
</html>
