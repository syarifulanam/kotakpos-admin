<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head>
    <title>Reset Password</title>
</head>
<body>
<div layout:fragment="content">
    <div class="container-fluid py-4">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <!--                Header-->
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h2 class="fw-bold mb-1">Reset Password</h2>
                        <p class="text-muted mb-0">Set a new password for <span class="fw-bold text-dark"
                                                                                th:text="${user.name}">User</span>.</p>
                    </div>
                    <a th:href="@{/users}" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left me-2">Back</i>
                    </a>
                </div>

<!--                Form Card-->
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4">
                        <form th:action="@{/users/reset-password}" method="post" th:object="${user}">
                            <input type="hidden" th:field="*{id}"/>

                            <div class="mb-4">
                                <label for="password" class="form-label fw-bold">New Password</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="bi bi-key text-muted"></i></span>
                                    <input type="password" class="form-control" id="password" th:field="*{password}"
                                    placeholder="Enter new password" required>
                                </div>
                                <small class="text-muted mt-1 d-block">Make sure it's at least 8 characters including
                                number and symbolis.</small>
                            </div>

                            <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                                <a th:href="@{/users}" class="btn btn-light border">Cancel</a>
                                <button type="submit" class="btn btn-warning px-4 text-dark">
                                    <i class="bi bi-arrow-counterclocwise me-2"></i>Reset Password
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>
</body>
</html>
