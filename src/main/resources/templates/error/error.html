<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${errorCode} + ' - ' + ${errorTitle}">Error</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="shortcut icon" th:href="@{/favicon.ico}" type="image/x-icon">

    <link rel="stylesheet" th:href="@{/css/error.css}">
</head>
<body>
<div class="container">
    <div class="d-flex justify-content-center">
        <div class="error-card">
            <div class="error-code" th:text="${errorCode}">500</div>
            <h2 class="error-title" th:text="${errorTitle}">Internal Server Error</h2>
            <p class="error-message" th:text="${errorMessage}">Something went wrong.</p>

            <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
                <a href="javascript:history.back()" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left"></i> Go Back
                </a>
                <a th:href="@{/dashboard}" class="btn btn-primary">
                    <i class="bi bi-house-door"></i> Go Home
                </a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
