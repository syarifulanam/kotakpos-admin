<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head>
    <title>Stock Adjustment</title>
</head>
<body>
<div layout:fragment="content">
    <div class="container-fluid py-4">
        <!--Header-->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold mb-1">Stock Adjustment</h2>
                <p class="text-muted mb-0">Manually correct stock levels.</p>
            </div>
        </div>

        <!--Main Card-->
        <div class="card border-0 shadow-0">
            <div class="card-body p-4">
                <!--Search Form-->
                <form th:action="@{/adjustments}" method="get" class="mb-4">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i
                                        class="bi bi-box-seam text-muted"></i></span>
                                <input type="number" name="productId" class="form-control border-start-0 bg-light"
                                       placeholder="Product ID" th:value="${productId}">
                            </div>
                        </div>
                        <div class="col-md-4">
                            <select name="type" class="form-select bg-light">
                                <option value="">All Adjustment Types</option>
                                <option th:each="adjType : ${adjustmentTypes}"
                                        th:value="${adjType}"
                                        th:text="${adjType.displayName}"
                                        th:selected="${adjType == type}"></option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <button class="btn btn-dark w-100" type="submit">Filter</button>
                        </div>
                        <div class="col-md-2">
                            <a th:href="@{/adjustments}" class="btn btn-outline-secondary w-100">Reset</a>
                        </div>
                    </div>
                </form>

                <!--Adjustments Table-->
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="bg-light text-uppercase text-muted small">
                        <tr>
                            <th class="border-0 py-3 ps-4">Product</th>
                            <th class="border-0 py-3">Type</th>
                            <th class="border-0 py-3">Quantity</th>
                            <th class="border-0 py-3">Note</th>
                            <th class="border-0 py-3 text-end pe-4">Date</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="adjustment : ${adjustments.content}">
                            <td class="ps-4">
                                <div class="d-flex align-items-center">
                                    <div class="avatar me-3 bg-info text-white rounded d-flex align-items-center justify-content-center"
                                         style="width: 40px; height: 40px;">
                                        <i class="bi bi-sliders"></i>
                                    </div>
                                    <div>
                                        <a th:href="@{/products/view/{id}(id=${adjustment.product.id})}"
                                           class="fw-bold text-decoration-none text-dark"
                                           th:text="${adjustment.product.name}">-</a>
                                        <div class="small text-muted">ID: <span
                                                th:text="${adjustment.product.id}">-</span>
                                        </div>
                                    </div>
                                </div>
                            </td>
                            <td>
                                <span class="badge rounded-pill"
                                      th:text="${adjustment.type}"
                                      th:classappend="${adjustment.type.name() == 'ADJUSTMENT_IN' ? 'bg-success-subtle text-success' : 'bg-danger-subtle text-danger'}">
                                </span>
                            </td>

                            <td>
                                <span class="fw-bold"
                                      th:text="${adjustment.quantity}"
                                      th:classappend="${adjustment.type.name() == 'ADJUSTMENT_IN' ? 'text-success' : 'text-danger'}">
                                </span>
                            </td>
                            <td>
                                <span class="text-muted fst-italic" th:text="${adjustment.note}">Note</span>
                            </td>
                            <td class="text-end pe-4">
                                <div class="d-flex flex-column align-items-end">
                                    <span th:text="${#temporals.format(adjustment.createdAt, 'dd MMM yyyy')}">-</span>
                                    <small class="text-muted"
                                           th:text="${#temporals.format(adjustment.createdAt, 'HH:mm')}">-</small>
                                    <small class="text-muted" th:text="'by ' + ${adjustment.createdBy.name}">-</small>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${adjustments.empty}">
                            <td colspan="5" class="text-center py-5 text-muted">
                                <i class="bi bi-sliders display-4 mb-3 d-block"></i>
                                No adjustments found matching your criteria.
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <!--                Pagination-->
                <div th:replace="~{fragments/pagination :: pagination(pagedData=${adjustments}, baseUrl='/adjustments',label='adjustments')}"></div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
