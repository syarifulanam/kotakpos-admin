<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - KotakPOS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="shortcut icon" th:href="@{/favicon.ico}" type="image/x-icon">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
<div class="auth-card">
    <div class="card-header">
        <i class="bi bi-shop logo"></i>
        <h3>KotakPOS Admin</h3>
        <p class="text-muted">Welcome back! Please login to your account.</p>
    </div>
    <div class="card-body">
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span th:text="${error}">Invalid email or password.</span>
        </div>

        <!--        param.param:objek bawaan Thymeleaf-->
        <div th:if="${param.param}" class="alert alert-danger" role="alert">
            Invalid email or password.
        </div>
        <!--        param.logout: Objek bawaan Thymeleaf-->
        <div th:if="${param.logout}" class="alert alert-success" role="alert">
            You have been logged out successfully.
        </div>
        <!--        param.registered: Objek bawaan Thymeleaf-->
        <div th:if="${param.registered}" class="alert alert-success" role="alert">
            Registration successful. Please wait for admin approval.
        </div>

        <form>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email" required>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>
            <div class="d-grid">
                <button type="submit" class="btn btn-primary">Login</button>
            </div>
        </form>
        <div class="mt-4 text-center">
            <span class="text-muted footer-link">Don't have an account?</span>
            <a th:href="@{/register}" class="footer-link">Register here</a>
        </div>
    </div>
</div>
</body>
</html>
