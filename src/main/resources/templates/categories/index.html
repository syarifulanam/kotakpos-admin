<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head>
    <title>Categories Management</title>
</head>
<body>
<div layout:fragment="content">
    <div class="container-fluid py-4">

        <!-- HEADER -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold mb-1">Categories Management</h2>
                <p class="text-muted mb-0">Organize your products into categories.</p>
            </div>
            <a th:href="@{/categories/create}" class="btn btn-primary shadow-sm">
                <i class="bi bi-tag me-2"></i>Add New Category
            </a>
        </div>

        <!-- CARD -->
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">

                <!-- SEARCH -->
                <form th:action="@{/categories}" method="get" class="mb-4">
                    <div class="row g-3">
                        <div class="col-md-9">
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0">
                                    <i class="bi bi-search text-muted"></i>
                                </span>
                                <input type="text" name="query"
                                       class="form-control border-start-0 bg-light"
                                       placeholder="Search by name..."
                                       th:value="${query}">
                            </div>
                        </div>
                        <div class="col-md-2">
                            <button class="btn btn-dark w-100" type="submit">Filter</button>
                        </div>
                        <div class="col-md-1">
                            <a th:href="@{/categories}" class="btn btn-outline-secondary w-100">Reset</a>
                        </div>
                    </div>
                </form>

                <!-- TABLE -->
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="bg-light text-uppercase text-muted small">
                        <tr>
                            <th class="ps-4">Category</th>
                            <th>Description</th>
                            <th class="text-end pe-4">Actions</th>
                        </tr>
                        </thead>
                        <tbody>

                        <tr th:each="category : ${categories.content}">
                            <td class="ps-4">
                                <div class="d-flex align-items-center">

                                    <div class="me-3 bg-success text-white rounded-circle d-flex align-items-center justify-content-center"
                                         style="width:40px; height:40px;">

                                        <i th:if="${category.icon != null and !#strings.isEmpty(category.icon)}"
                                           th:class="${'bi ' + category.icon}"></i>

                                        <span th:if="${category.icon == null or #strings.isEmpty(category.icon)}"
                                              th:text="${#strings.substring(category.name,0,1)}"></span>
                                    </div>

                                    <div>
                                        <div class="fw-bold" th:text="${category.name}"></div>
                                        <small class="text-muted">ID:
                                            <span th:text="${category.id}"></span>
                                        </small>
                                    </div>
                                </div>
                            </td>

                            <td th:text="${#strings.abbreviate(category.description,100)}"></td>

                            <td class="text-end pe-4">
                                <div class="btn-group">

                                    <a th:href="@{/categories/edit/{id}(id=${category.id})}"
                                       class="btn btn-sm btn-light text-primary">
                                        <i class="bi bi-pencil"></i>
                                    </a>

                                    <button type="button"
                                            class="btn btn-sm btn-light text-danger"
                                            data-bs-toggle="modal"
                                            data-bs-target="#deleteModal"
                                            th:data-id="${category.id}"
                                            th:data-name="${category.name}">
                                        <i class="bi bi-trash"></i>
                                    </button>

                                </div>
                            </td>
                        </tr>

                        <tr th:if="${categories.empty}">
                            <td colspan="3" class="text-center py-5 text-muted">
                                No categories found
                            </td>
                        </tr>

                        </tbody>
                    </table>
                </div>

                <!-- PAGINATION -->
                <div class="d-flex justify-content-between align-items-center mt-4"
                     th:if="${categories.totalPages > 1}">

                    <small class="text-muted">
                        Showing <span th:text="${categories.numberOfElements}"></span> of
                        <span th:text="${categories.totalElements}"></span>
                    </small>

                    <ul class="pagination pagination-sm mb-0">

                        <li class="page-item" th:classappend="${categories.first}? 'disabled'">
                            <a class="page-link"
                               th:href="@{/categories(page=${categories.number-1}, query=${query})}">
                                ‹
                            </a>
                        </li>

                        <li class="page-item"
                            th:each="i : ${#numbers.sequence(0, categories.totalPages-1)}"
                            th:classappend="${categories.number == i}? 'active'">

                            <a class="page-link"
                               th:href="@{/categories(page=${i}, query=${query})}"
                               th:text="${i+1}">
                            </a>
                        </li>

                        <li class="page-item" th:classappend="${categories.last}? 'disabled'">
                            <a class="page-link"
                               th:href="@{/categories(page=${categories.number+1}, query=${query})}">
                                ›
                            </a>
                        </li>

                    </ul>
                </div>

            </div>
        </div>

    </div>
</div>

<!-- DELETE MODAL -->
<div class="modal fade" id="deleteModal">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <h5>Confirm Delete</h5>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                Delete category <strong id="categoryName"></strong> ?
            </div>

            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>

                <form id="deleteForm" method="post" action="">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit" class="btn btn-danger">Delete</button>
                </form>
            </div>

        </div>
    </div>
</div>

<script th:src="@{/js/categories.js}"></script>
</body>
</html>
