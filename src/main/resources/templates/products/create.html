<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head>
    <title>Create Product</title>
</head>
<body>
<div layout:fragment="content">
    <div class="container-fluid py-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <!--                Header-->
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h2 class="fw-bold mb-1">Create New Product</h2>
                        <p class="text-muted mb-0">Fill in the details below to add a new product to your catalog.</p>
                    </div>
                    <a th:href="@{/products}" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left me-2"></i>Back to list
                    </a>
                </div>

                <!--                Form Card-->
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4">
                        <form th:action="@{/products/create}" th:object="${productDto}" method="post"
                              enctype="multipart/form-data">

                            <div class="row mb-4">
                                <div class="col-md-12">
                                    <h5 class="text-primary mb-3">Core Details</h5>
                                </div>
                                <div class="col-md-12 mb-3">
                                    <label for="name" class="form-label fw-bold">Product Name</label>
                                    <input type="text" id="name" th:field="*{name}" class="form-control"
                                           placeholder="e.g. Wireless Mouse" required
                                           th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}"
                                         th:errors="*{name}"></div>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="categoryId" class="form-label fw-bold">Category</label>
                                    <select id="categoryId" th:field="*{categoryId}" class="form-select" required
                                            th:classappend="${#fields.hasErrors('categoryId')} ? 'is-invalid' : ''">
                                        <option value="">Select a category</option>
                                        <option th:each="category : ${categories}"
                                                th:value="${category.id}"
                                                th:text="${category.name}"></option>
                                    </select>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label for="unit" class="form-label fw-bold">Unit</label>
                                    <select id="unit" th:field="*{unit}" class="form-select" required
                                            th:classappend="${#fields.hasErrors('unit')} ? 'is-invalid' : ''">
                                        <option value="">Select a unit</option>
                                        <option th:each="unitOpt : ${units}"
                                                th:value="${unitOpt}"
                                                th:text="${unitOpt.name()}"></option>
                                    </select>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('unit')}"
                                         th:errors="*{unit}"></div>
                                </div>

                                <div class="row mb-4">
                                    <div class="col-md-12">
                                        <h5 class="text-primary mb-3">Pricing & Stock</h5>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="sellPrice" class="form-label fw-bold">Sell Price</label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-light">Rp</span>
                                            <input type="number" id="sellPrice" th:field="*{sellPrice}"
                                                   class="form-control"
                                                   step="0.01" placeholder="0.00" required
                                                   th:classappend="${#fields.hasErrors('sellPrice')} ? 'is-invalid' : ''">
                                            <div class="invalid-feedback" th:if="${#fields.hasErrors('sellPrice')}"
                                                 th:errors="*{sellPrice}"></div>
                                        </div>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="costPrice" class="form-label fw-bold">Cost Price</label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-light">Rp</span>
                                            <input type="number" id="costPrice" th:field="*{costPrice}"
                                                   class="form-control"
                                                   step="0.01" placeholder="0.00" required
                                                   th:classappend="${#fields.hasErrors('costPrice')} ? 'is-invalid' : ''">
                                            <div class="invalid-feedback" th:if="${#fields.hasErrors('costPrice')}"
                                                 th:errors="*{costPrice}"></div>
                                        </div>
                                    </div>
                                    <div class="col-md-12 mb-3">
                                        <label for="stock" class="form-label fw-bold">Initial Stock</label>
                                        <input type="number" id="stock" th:field="*{stock}" class="form-control"
                                               placeholder="0" readonly>
                                        <small class="text-muted">Stock is managed via Purchases and Adjustments after
                                            creation.</small>
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('stock')}"
                                             th:errors="*{stock}"></div>
                                    </div>
                                </div>

                                <div class="row mb-4">
                                    <div class="col-md-12">
                                        <h5 class="text-primary mb-3">Media</h5>
                                    </div>
                                    <div class="col-md-12 mb-3">
                                        <label for="image" class="form-label fw-bold">Product Image</label>
                                        <input type="file" id="image" name="image" class="form-control"
                                               accept=".jpg,.png,.webp">
                                        <small class="form-text text-muted">Max size 2MB. Allowed types: JPG,
                                            PNG.</small>
                                    </div>
                                </div>

                                <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                                    <a th:href="@{/products}" class="btn btn-light border">Cancel</a>
                                    <button type="submit" class="btn btn-primary px-4">
                                        <i class="bi bi-check-lg me-2"></i>Create Product
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
