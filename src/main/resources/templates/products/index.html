<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head>
    <title>Products Management</title>
</head>
<body>
<div layout:fragment="content">
    <div class="container-fluid py-4">
        <!--    Header-->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold mb-1">Products Management</h2>
                <p class="text-muted mb-0">Manage your entire product catalog.</p>
            </div>
            <a th:href="@{/products/new}" class="btn btn-primary shadow-sm">
                <i class="bi bi-box-seam me-2"></i>Add New Product
            </a>
        </div>

        <!--    Main Card-->
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">
                <!--            Search Form-->
                <form th:action="@{/products}" method="get" class="mb-4">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i
                                    class="bi bi-search text-muted"></i></span>
                                <input type="text" name="query" class="form-control border-start-0 bg-light"
                                       placeholder="Search by ID, Name, or Barcode..." th:value="${query}">
                            </div>
                        </div>
                        <div class="col-md-3">
                            <select class="form-select bg-light" name="categoryId">
                                <option value="" th:selected="${categoryId == null}">All Categories</option>
                                <option th:each="category : ${categories}"
                                        th:value="${category.id}"
                                        th:text="${category.name}"
                                        th:selected="${categoryId == category.id}">Category Name
                                </option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <button class="btn btn-dark w-100" type="submit">Filter</button>
                        </div>
                        <div class="col-md-1">
                            <a th:href="@{/products}" class="btn btn-outline-secondary w-100">Reset</a>
                        </div>
                    </div>
                </form>

                <!--                Products Table-->
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="bg-light text-uppercase text-muted small">
                        <tr>
                            <th class="border-0 py-3 ps-4">
                                <a th:href="@{/products(sortDir=${sortDir == 'asc' ? 'desc' : 'asc'}, sortBy='name', query=${query}, categoryId=${categoryId})}"
                                   class="text-decoration-none text-muted">Product
                                    <i th:if="${sortBy == 'name' || sortDir != null}"
                                       th:class="${sortDir == 'asc' ? 'bi-sort-alpha-down' : 'bi-sort-alpha-up'}"></i>
                                </a>
                            </th>
                            <th class="border-0 py3">Category</th>
                            <th class="border-0 py3">Pricing</th>
                            <th class="border-0 py3">Stock</th>
                            <th class="border-0 py3">Barcode</th>
                            <th class="border-0 py3 text-end pe-4">Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="product : ${productPage.content}">
                            <td class="ps-4">
                                <div class="d-flex align-items-center">
                                    <img th:if="${product.imageUrl}"
                                         th:src="@{${product.imageUrl}}"
                                         alt="Product Image"
                                         class="rounded me-3"
                                         style="width: 40px; height: 40px; object-fit: cover;">
                                    <div th:unless="${product.imageUrl}"
                                         class="avatar me-3 bg-secondary text-white rounded d-flex align-items-center justify-content-center"
                                         style="width: 40px; height: 40px;">
                                        <i class="bi bi-box-seam"></i>
                                    </div>
                                </div>
                                <h6 class="mb-0 fw-bold" th:text="${product.name}">Product Name</h6>
                                <small class="text-muted">ID: <span th:text="${product.id}">1</span></small>
                            </td>
                            <td>
                                <span class="badge bg-light text-dark border" th:text="${product.category.name}">Category</span>
                            </td>
                            <td>
                                <div>
                                    <small class="text-muted">Sell:</small> <span class="fw-bold"
                                                                                  th:text="'Rp ' + ${#numbers.formatDecimal(product.sellPrice, 0, 'COMMA', 0, 'POINT')}"></span>
                                </div>
                                <div>
                                    <small class="text-muted">Cost:</small> <span
                                        th:text="'Rp ' + ${#numbers.formatDecimal(product.costPrice, 0, 'COMMA', 0, 'POINT')}"></span>
                                </div>
                            </td>
                            <td>
                                <span class="fw-bold"
                                      th:text="${product.stock} + '' + ${product.unit.name()}">100</span>
                            </td>
                            <td>
                                <svg class="barcode"
                                     jsbarcode-format="CODE128"
                                     th:attr="jsbarcode-value=${product.barcode}"
                                     jsbarcode-width="1.5"
                                     jsbarcode-height="30"
                                     jsbarcode-displayValue="false">
                                </svg>
                            </td>
                            <td class="text-end pe-4">
                                <div class="btn-group">
                                    <a th:href="@{/products/view/{id}(id=${product.id})}"
                                       class="btn btn-sm btn-light text-success" title="View" data-bs-toggle="tooltip">
                                        <i class="bi bi-eye"></i>
                                    </a>
                                    <a th:href="@{/products/edit/{id}(id=${product.id})}"
                                       class="btn btn-sm light text-primary" title="Edit" data-bs-toggle="tooltip">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                    <a th:href="@{/products/adjust/{id}(id=${product.id})}"
                                       class="btn btn-sm btn-light text-info" title="Adjust Stocl"
                                       data-bs-toggle="tooltip">
                                        <i class="bi bi-gear"></i>
                                    </a>
                                    <button type="button" class="btn btn-sm btn-light text-danger" title="Delete"
                                            data-bs-toggle="modal" data-bs-target="#deleteModal"
                                            th:data-id="${product.id}" th:data-name="${product.name}">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${productPage.empty}">
                            <td colspan="6" class="text-center py-5 text-muted">
                                <i class="bi bi-box-seam display-4 mb-3 d-block"></i>
                                No products found matching your criteria.
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <!--                Pagination-->
                <div th:replace="~{fragments/pagination :: pagination(pagedData=${productPage}, baseUrl='/products',label='products')}"></div>
            </div>
        </div>
    </div>

    <!--    DELETE CONFIRMATION MODAL-->
    <div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="deleteModalLabel">Confirm Delete</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    Are you sure you want to delete product <strong id="productName"></strong>?
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <form id="deleteForm" method="post" action="">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit" class="btn btn-danger">Delete</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>

    <script th:src="@{/js/product.js}"></script>
</div>
</body>
</html>
