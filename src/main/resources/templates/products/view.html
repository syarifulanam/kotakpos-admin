<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head>
    <title>View Product</title>
</head>
<body>
<div layout:fragment="content">
    <div class="container-fluid py-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <!--                Header-->
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h3 class="fw-bold mb-1">Product details</h3>
                        <p class="text-muted mb-0">Viewing details for
                            <strong class="text-dark" th:text="${productDto.name}">Product Name</strong>.</p>
                    </div>
                    <a th:href="@{/products}" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left me-2"></i>back to List
                    </a>
                </div>

                <!--                View Card-->
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4">
                        <div class="row-md-4">
                            <div th:if="${productDto.imageUrl}" class="mb-3">
                                <img th:src="@{${productDto.imageUrl}}" alt="Product Image"
                                     class="img-fluid rounded border">
                            </div>
                            <div th:unless="${productDto.imageUrl}"
                                 class="mb-3 p-4 border rounded bg-light text-center text-muted">
                                <i class="bi bi-box-seam display-4"></i>
                                <p class="mb-0 mt-2">No Image</p>
                            </div>
                        </div>
                        <div class="col-md-8">
                            <h3 class="fw-bold" th:text="${productDto.name}">Product Name</h3>
                            <p class="text-muted">Category:
                                <span class="bedge bg-primary" th:text="${productDto.category.name}">Category</span>
                            </p>

                            <div class="row mt-4">
                                <div class="col-md-6">
                                    <p class="mb-1 small text-muted text-uppercase">Sell Price</p>
                                    <h4 class="fw-bold text-success"
                                        th:text="'Rp ' + ${#numbers.formatDecimal(productDto.sellPrice,0, 'COMMA', 0, 'POINT')}">
                                        Rp 0</h4>
                                </div>
                                <div class="col-md-6">
                                    <p class="mb-1 small text-muted text-uppercase">Cost Price</p>
                                    <h4 class="fw-bold text-danger"
                                        th:text="'Rp ' + ${#numbers.formatDecimal(productDto.costPrice, 0, 'COMMA', 0, 'POINT')}">
                                        Rp 0</h4>
                                </div>
                            </div>
                            <div class="mt-3">
                                <p class="mb-1 small text-muted text-uppercase">Current Stock</p>
                                <h4 class="fw-bold" th:text="${productDto.stock} + '' + ${productDto.unit.name}">
                                    0</h4>
                            </div>
                        </div>
                    </div>
                    <div class="row mt-4 pt-3 border-top">
                        <div class="col-md-12">
                            <h5 class="text-primary mb-3">Barcode</h5>
                            <svg class="barcode"
                                 jsbarcode-format="CODE128"
                                 th:jsbarcode-value="${productDto.barcode}"
                                 jsbarcode-width="2"
                                 jsbarcode-height="60"
                                 jsbarcode-displayValue="true">
                            </svg>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>

    <script th:src="@{/js/product.js}"></script>
</div>
</body>
</html>
