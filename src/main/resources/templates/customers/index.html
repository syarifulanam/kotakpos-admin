<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head>
    <title>Customers Management</title>
</head>
<body>
<div layout:fragment="content">
    <div class="container-fluid py-4">
        <!--Header        -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold mb-1">Customers Management</h2>
                <p class="text-muted mb-0">Manage your customer database.</p>
            </div>
            <a th:href="@{/customers/new}" class="btn btn-primary shadow-sm">
                <i class="bi bi-person-plus me-2"></i><span>Add New Customer</span>

            </a>
        </div>

        <!--        Main Card-->
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">
                <!--                Search Form-->
                <form th:action="@{/customers}" method="get" class="mb-4">
                    <div class="row g-3">
                        <div class="col-md-3">
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i
                                        class="bi bi-search text-muted"></i></span>
                                <input type="text" name="name" class="form-control border-start-0 bg-light"
                                       placeholder="Search by name..." th:value="${name}">
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i
                                        class="bi bi-telephone text-muted"></i></span>
                                <input type="text" name="phone" class="form-control border-start-0 bg-light"
                                       placeholder="Search by phone ..." th:value="${phone}">
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i
                                        class="bi bi-envelope text-muted"></i></span>
                                <input type="text" name="email" class="form-control border-start-0 bg-light"
                                       placeholder="Search by email..." th:value="${email}">
                            </div>
                        </div>
                        <div class="col-md-2">
                            <button class="btn btn-dark w-100" type="submit">Filter</button>
                        </div>
                        <div class="col-md-1">
                            <a th:href="@{/customers}" class="btn btn-outline-secondary w-100">Reset</a>
                        </div>
                    </div>
                </form>

                <!--                Costomers Table-->
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="bg-light text-uppercase text-muted small">
                        <tr>
                            <th class="border-0 py-3 ps-4">
                                <a th:href="@{/customers(sortDir=${sortDir == 'asc' ? 'desc' : 'asc'}, sortBy='name')}"
                                   class="text-decoration-none text-muted">Customers
                                    <i th:if="${sortBy == 'name' || sortDir != null}"
                                       th:class="${sortDir == 'asc' ? 'bi-sort-alpha-down' : 'bi-sort-alpha-up'}"></i>
                                </a>
                            </th>
                            <th class="border-0 py-3">Contact Info</th>
                            <th class="border-0 py-3 text-end pe-4">Action</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="customer : ${customers.content}">
                            <td class="ps-4">
                                <div class="d-flex align-items-center">
                                    <div class="avatar me-3 bg-success text-white rounded-circle d-flex align-items-center justify-content-center"
                                         style="width: 40px; height: 40px; font-weight: bold;">
                                        <span th:text="${#strings.substring(customer.name, 0, 1)}"></span>
                                    </div>
                                    <div>
                                        <h6 class="mb-0 fw-bold" th:text="${customer.name}">Customer Name</h6>
                                        <small class="text-muted">ID: <span th:text="${customer.id}">1</span></small>
                                    </div>
                                </div>
                            </td>
                            <td>
                                <div class="d-flex flex-column">
                                    <span class="mb-1"><i class="bi bi-telephone me-2 text-muted"></i><span
                                            th:text="${customer.phone}">Phone</span></span>
                                    <span><i class="bi bi-envelope me-2 text-muted"></i><span
                                            th:text="${customer.email}">Email</span></span>
                                </div>
                            </td>
                            <td class="text-end pe-4">
                                <div class="btn-group">
                                    <a th:href="@{/customers/edit/{id}(id=${customer.id})}"
                                       class="btn btn-sm btn-light text-primary" title="Edit" data-bs-toggle="tooltip">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                    <button type="button" class="btn btn-sm btn-light text-danger" title="Delete"
                                            data-bs-toggle="modal" data-bs-target="#deleteModal"
                                            th:data-id="${customer.id}" th:data-name="${customer.name}">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${customers.empty}">
                            <td colspan="3" class="text-center py-5 text-muted">
                                <i class="bi bi-people display-4 mb-3 d-block"></i>
                                No customers found matching your criteria.
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>

<!--                Pagination-->
                <div class="d-flex justify-content-between align-items-center mt-4"
                th:if="${customers.totalPages > 1}">
                    <small class="text-muted">
                        Showing <span th:text="${customers.numberOfElements}">0</span> of <span
                    th:text="${customers.totalElements}">0</span> customers
                    </small>
                    <nav>
                        <ul class="pagination pagination-sm mb-0">
                            <i class="page-item" th:classappend="${customers.first} ? 'disabled'">
                                <a class="page-link border-0"
                                th:href="@{/customers(page=${customers.number - 1}, size=${customers.size}, name=${name}, phone=${phone}, email=${email})}">
                                    <i class="bi bi-chevron-left"></i>
                                </a>
                                <li class="page-item" th:each="i : ${#numbers.sequence(0, customers.totalPages - 1)}"
                                th:classappend="${customers.number == i} ? 'active'">
                                    <a class="page-link border-0 rounded-circle mx-1"
                                    th:href="@{/customers(page=${i}, size=${customers.size}, name=${name}, phone=${phone}, email=${email})}"
                                    th:text="${i + 1}"
                                    th:style="${customers.number == 1 ? 'background-color: var(--bs-primary); color: white; : ''}">1</a>
                                </li>
                                <a class="page-item" th:classappend="${customers.number + 1}, size=${customers.size}, name=${name}, phone=${phone}, email=${email}">
                                    <i class="bi bi-chevron-right"></i>
                                </a>
                            </i>
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
    </div>

    <!--    DELETE CONFIRMATION MODAL-->
    <div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="deleteModalLabel">Confirm Delete</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    Are you sure you want to delete customer <strong id="customerName"></strong>?
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <form id="deleteForm" method="post" action="">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit" class="btn btn-danger">Delete</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{/js/customers.js}"></script>
</div>
</body>
</html>
