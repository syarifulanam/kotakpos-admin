<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head>
    <title th:text="${customer.id == null ? 'New Customer' : 'Edit Customer'}">Customer Form</title>
</head>

<body>
<div layout:fragment="content">
    <div class="container-fluid py-4">

        <div class="row justify-content-center">
            <div class="col-md-8">

                <!-- Header -->
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h2 class="fw-bold mb-1"
                            th:text="${customer.id == null ? 'Create New Customer' : 'Edit Customer'}">
                        </h2>
                        <p class="text-muted mb-0">
                            Fill in the details below to
                            <span th:text="${customer.id == null ? 'add a new customer' : 'update customer information'}"></span>.
                        </p>
                    </div>

                    <a th:href="@{/customers}" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left me-2"></i>Back to list
                    </a>
                </div>

                <!-- Card -->
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4">

                        <form th:action="${customer.id == null} ? @{/customers} : @{/customers/update/{id}(id=${customer.id})}"
                              th:object="${customer}" method="post">

                            <div class="mb-4">
                                <h5 class="text-primary mb-3">Basic Information</h5>

                                <div class="mb-3">
                                    <label for="name" class="form-label fw-bold">Full Name</label>
                                    <input type="text" id="name" class="form-control"
                                           th:field="*{name}"
                                           placeholder="Enter full name">
                                </div>

                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="phone" class="form-label fw-bold">Phone Number</label>
                                        <input type="text" id="phone" class="form-control"
                                               th:field="*{phone}"
                                               placeholder="Enter phone number">
                                    </div>

                                    <div class="col-md-6 mb-3">
                                        <label for="email" class="form-label fw-bold">Email</label>
                                        <input type="email" id="email" class="form-control"
                                               th:field="*{email}"
                                               placeholder="Enter email address">
                                    </div>
                                </div>
                            </div>

                            <div class="mb-4">
                                <h5 class="text-primary mb-3">Address Details</h5>

                                <div class="mb-3">
                                    <label for="address" class="form-label fw-bold">Street Address</label>
                                    <textarea id="address" class="form-control"
                                              th:field="*{address}" rows="2"
                                              placeholder="Enter street address"></textarea>
                                </div>

                                <div class="row">
                                    <div class="col-md-4 mb-3">
                                        <label for="city" class="form-label fw-bold">City</label>
                                        <input type="text" id="city" class="form-control"
                                               th:field="*{city}"
                                               placeholder="City">
                                    </div>

                                    <div class="col-md-4 mb-3">
                                        <label for="postalCode" class="form-label fw-bold">Postal Code</label>
                                        <input type="text" id="postalCode" class="form-control"
                                               th:field="*{postalCode}"
                                               placeholder="Postal code">
                                    </div>

                                    <div class="col-md-4 mb-3">
                                        <label for="country" class="form-label fw-bold">Country</label>
                                        <input type="text" id="country" class="form-control"
                                               th:field="*{country}"
                                               placeholder="Country">
                                    </div>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="notes" class="form-label fw-bold">Notes</label>
                                <textarea id="notes" class="form-control"
                                          th:field="*{notes}" rows="3"
                                          placeholder="Additional notes"></textarea>
                            </div>
                            <div class="d-flex justify-content-end gap-2 border-top pt-3">
                                <a th:href="@{/customers}" class="btn btn-light border">Cancel</a>

                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-check-lg me-2"></i>
                                    <span th:text="${customer.id == null ? 'Save Customer' : 'Update Customer'}"></span>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
