<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head>
    <title>Create Purchase Order</title>
</head>
<body>
<div layout:fragment="content">
    <div class="container-fluid py-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <!--                Header-->
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h2 class="fw-bold mb-1">Create Purchase Order</h2>
                        <p class="text-muted mb-0">Start a new purchase order by providing the initial details.</p>
                    </div>
                    <a th:href="@{/purchases}" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left me-2">Back to List</i>
                    </a>
                </div>

                <!--                Form Card-->
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4">
                        <form th:action="@{/purchases}" th:object="${purchase}" method="post">

                            <div class="row mb-4">
                                <div class="col-md-12">
                                    <h5 class="text-primary mb-3">Order Details</h5>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="invoiceNumber" class="form-label fw-bold">Invoice Number</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light"><i class="bi bi-receipt text-muted"></i></span>
                                        <input type="text" class="form-control" id="invoiceNumber"
                                               th:field="*{invoiceNumber}" placeholder="e.g. INV-2023-123" required>
                                    </div>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="supplier" class="form-label fw-bold">Supplier</label>
                                    <select class="form-select" id="supplier" th:field="*{supplier}" required>
                                        <option value="">Select a supplier</option>
                                        <option th:each="s : ${suppliers}" th:value="${s.id}"
                                                th:text="${s.name}"></option>
                                    </select>
                                </div>
                                <div class="col-md-12 mb-3">
                                    <label for="note" class="from-label fw-bold">Notes</label>
                                    <textarea class="form-control" id="note" th:field="*{note}" rows="3"
                                              placeholder="Any internal notes for this purchase order..."></textarea>
                                </div>
                            </div>

                            <div class="alert alert-info" role="alert">
                                <i class="bi bi-info-circle-fill me-2"></i>
                                You can add products to this purchase order after it has been created.
                            </div>

                            <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                                <a th:href="@{/purchases}" class="btn btn-light border">Cancel</a>
                                <button type="submit" class="btn btn-primary px-4">
                                    <i class="bi bi-check-lg me-2"></i>Create and continue
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
