<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--Fragment Pagination-->
<div th:fragment="pagination"
     th:with="pagedData=${pagedData}, baseUrl=${baseUrl}, query=${query != null ? query : ''}, sortBy=${sortBy != null ? sortBy : ''}, sortDir=${sortDir != null ? sortDir : ''}"
     class="d-flex justify-content-between align-items-center mt-4"
     th:if="${pagedData != null and pagedData.totalPages > 1}">

    <small class="text-muted">
        Showing <span th:text="${pagedData.numberOfElements}">0</span>
        of <span th:text="${pagedData.totalElements}">0</span>
        <span th:text="${label}">items</span>
    </small>

    <nav>
        <ul class="pagination pagination-sm mb-0">
            <!--            First Page-->
            <li class="page-item" th:classappend="${pagedData.first} ? 'disabled'">
                <a class="page-link border-0"
                   th:href="@{${baseUrl}(page=0, query=${query}, sortBy=${sortBy}, sortDir=${sortDir})}">
                    <i class="bi bi-chevron-double-left"></i>
                </a>
            </li>

            <!--            Previous Page-->
            <li class="page-item" th:classappend="${!pagedData.hasPrevious()} ? 'disabled'">
                <a class="page-link border-0"
                   th:href="@{${baseUrl}(page=${pagedData.number - 1}, query=${query}, sortBy=${sortBy}, sortDir=${sortDir})}">
                    <i class="bi bi-chevron-left"></i>
                </a>
            </li>

            <!--            Page Numbers-->
            <li class="page-item"
                th:each="i : ${#numbers.sequence(0, pagedData.totalPages - 1)}"
                th:classappend="${pagedData.number == i} ? 'active'">
                <a class="page-link border-0 rounded-circle mx-1"
                   th:href="@{${baseUrl}(page=${i}, query=${query}, sortBy=${sortBy}, sortDir=${sortDir})}"
                   th:text="${i + 1}"
                   th:style="${pagedData.number == i ? 'background-color: var(--bs-primary); color: white;' : ''}">1</a>
            </li>

            <!--            Next Page-->
            <li class="page-item" th:classappend="${!pagedData.hasNext()} ? 'disabled'">
                <a class="page-link border-0"
                   th:href="@{${baseUrl}(page=${pagedData.number + 1}, query=${query}, sortBy=${sortBy}, sortDir=${sortDir})}">
                    <i class="bi bi-chevron-right"></i>
                </a>
            </li>

            <!--            Last Page-->
            <li class="page-item" th:classappend="${pagedData.last} ? 'disabled'">
                <a class="page-link border-0"
                   th:href="@{${baseUrl}(page=${pagedData.totalPages - 1}, query=${query}, sortBy=${sortBy}, sortDir=${sortDir})}">
                    <i class="bi bi-chevron-double-right"></i>
                </a>
            </li>
        </ul>
    </nav>
</div>

</body>
</html>
