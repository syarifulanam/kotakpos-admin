<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head>
    <title>Stock Movements</title>
</head>
<body>
<div layout:fragment="content">
    <div class="container-fluid py-4">
        <!--    Header-->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold mb-1">Stock Movements</h2>
                <p class="text-muted mb-0">Track the history of all stock changes.</p>
            </div>
        </div>

        <!--    Main Card-->
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">
                <!--            Search Form-->
                <form th:action="@{/stock-movements}" method="get" class="mb-4">
                    <div class="row g-3">
                        <div class="col-md-3">
                            <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i
                                    class="bi bi-box-seam text-muted"></i></span>
                                <input type="number" name="productId" class="form-control border-start-0 bg-light"
                                       placeholder="Product ID" th:value="${productId}">
                            </div>
                        </div>
                        <div class="col-md-2">
                            <select name="type" class="form-select bg-light">
                                <option value="">All Movement Types</option>
                                <option th:each="movType : ${stockMovementTypes}"
                                        th:value="${movType}"
                                        th:text="${movType.displayName}"
                                        th:selected="${movType == type}"></option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <select name="referenceType" class="form-select  bg-light">
                                <option value="">All Reference Types</option>
                                <option th:each="refType : ${referenceTypes}"
                                        th:value="${refType}"
                                        th:text="${refType.displayName}"
                                        th:selected="${refType == referenceType}"></option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i
                                        class="bi bi-hash text-muted"></i></span>
                                <input type="text" name="referenceId" class="form-control border-start-0 bg-light"
                                       placeholder="Reference ID" th:value="${referenceId}">
                            </div>
                        </div>
                        <div class="col-md-2">
                            <button class="btn btn-dark w-100" type="submit">Filter</button>
                        </div>
                    </div>
                </form>

                <!--            Stock Movements Table-->
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="bg-light text-uppercase text-muted small">
                        <tr>
                            <th class="border-0 py-3 ps-4">Product</th>
                            <th class="border-0 py-3">Type</th>
                            <th class="border-0 py-3">Quantity</th>
                            <th class="border-0 py-3">Reference</th>
                            <th class="border-0 py-3">Note</th>
                            <th class="border-0 py-3 text-end pe-4">Date</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="mov : ${stockMovements.content}">
                            <td class="ps-4">
                                <div class="d-flex align-items-center">
                                    <div class="avatar me-3 bg-secondary text-white rounded d-flex align-items-center justify-content-center"
                                    style="width: 40px; height: 40px;">
                                        <i class="bi bi-box-seam"></i>
                                    </div>
                                    <div>
                                        <a th:href="@{/products/view/{id}(id=${mov.product.id})}"
                                           class="fw-bold text-decoration-none text-dark"
                                           th:text="${mov.product.name}">
                                            Product Name
                                        </a>
                                        <div class="small text-muted">
                                            ID: <span th:text="${mov.product.id}">1</span>
                                        </div>
                                    </div>
                                </div>
                            </td>
                            <td>
                                <span class="badge rounded-pill"
                                      th:text="${mov.type.displayName}"
                                      th:classappend="${mov.type.name() == 'IN' ? 'bg-success-subtle text-success' : 'bg-danger-subtle text-danger'}">
                                    IN
                                </span>
                            </td>
                            <td>
                               <span class="fw-bold" th:text="${mov.quantity}"
                                     th:classappend="${mov.type.name() == 'IN' ? 'text-success' : 'text-danger'}">
                                   -
                               </span>
                            </td>
                            <td>
                                <div class="d-flex align-items-center">
                                    <div class="rounded bg-primary bg-opacity-10 p-2 me-2">
                                        <i th:classappend="${mov.referenceType?.name() == 'PURCHASE' ? 'bi bi-cart' :
                                        (mov.referenceType?.name() == 'SALE' ? 'bi bi-cash' : 'bi bi-box')}"
                                           class="text-primary"></i>
                                    </div>
                                    <div class="d-flex flex-column">
                                        <span class="fw-bold"
                                              th:text="${mov.referenceType?.displayName}">-</span>
                                        <small class="text-muted" th:text="'Ref #' + ${mov.referenceId}">-</small>
                                    </div>
                                </div>
                            </td>
                            <td>
                                <span class="text-muted fst-italic" th:text="${mov.note}">Note</span>
                            </td>
                            <td class="text-end pe-4">
                                <div class="d-flex flex-column align-items-end">
                                    <span th:text="${#temporals.format(mov.createdAt, 'dd MMM yyyy')}">01 Jan 2023</span>
                                    <small class="text-muted" th:text="${#temporals.format(mov.createdAt, 'HH:mm')}">10:00</small>
                                    <small class="text-muted" th:text="'by ' + ${mov.createdBy.name}">by Admin</small>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${stockMovements.content.empty}">
                            <td colspan="6" class="text-center py-5 text-muted">
                                <i class="bi bi-arrow-left-right display-4 mb-3 d-block"></i>
                                No stock movements found matching your criteria.
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <!--                Pagination-->
                <div th:replace="~{fragments/pagination :: pagination(pagedData=${stockMovements},baseUrl='/stock-movements',label='stockMovements')}"></div>

            </div>
        </div>
    </div>
</body>
</html>
