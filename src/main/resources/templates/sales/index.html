<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head>
    <title>Sales Management</title>
</head>
<body>
<div layout:fragment="content">
    <div class="container-fluid py-4">
        <!--Header-->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold mb-1">Sales Management</h2>
                <p class="text-muted mb-0">Track and manage all customer sales.</p>
            </div>
        </div>

        <!--Main Card-->
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">
                <!--Search Form-->
                <form th:action="@{/sales}" method="get" class="mb-4">
                    <div class="row g-3">
                        <div class="col-md-3">
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i
                                        class="bi bi-receipt text-muted"></i></span>
                                <input type="text" name="invoiceNumber" class="form-control border-start-0 bg-light"
                                       placeholder="Search by invoice..." th:value="${invoiceNumber}">
                            </div>
                        </div>
                        <div class="col-md-3">
                            <select id="status" name="status" class="form-select bg-light">
                                <option value="">All Statuses</option>
                                <option th:each="s : ${statuses}"
                                        th:value="${s}"
                                        th:text="${s.displayName}"
                                        th:selected="${s == status}"></option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <input type="datetime-local" name="startDate" class="form-control bg-light"
                                   th:value="${startDate != null ? #temporals.format(startDate, 'yyyy-MM-dd''T''HH:mm') : ''}">
                        </div>
                        <div class="col-md-2">
                            <input type="datetime-local" name="endDate" class="form-control bg-light"
                                   th:value="${endDate != null ? #temporals.format(endDate, 'yyyy-MM-dd''T''HH:mm') : ''}">
                        </div>
                        <div class="col-md-1">
                            <button class="btn btn-dark w-100" type="submit">Filter</button>
                        </div>
                        <div class="col-md-1">
                            <a th:href="@{/sales}" class="btn btn-outline-secondary w-100">Reset</a>
                        </div>
                    </div>
                </form>

                <!--Sales Table-->
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="bg-light text-uppercase text-muted small">
                        <tr>
                            <th class="border-0 py-3 ps-4">
                                <a th:href="@{/sales(sortDir=${sortDir == 'asc' ? 'desc' : 'asc'}, sortBy='invoiceNumber')}"
                                   class="text-decoration-none text-muted">Sales Invoice No
                                    <i th:if="${sortBy == 'invoiceNumber' || sortDir != null}"
                                       th:class="${sortDir == 'asc' ? 'bi-sort-alpha-down' : 'bi-sort-alpha-up'}"></i>
                                </a>
                            </th>
                            <th class="border-0 py-3">Customer</th>
                            <th class="border-0 py-3">Total Amount</th>
                            <th class="border-0 py-3">Status</th>
                            <th class="border-0 py-3">Created At</th>
                            <th class="border-0 py-3 text-end pe-4">Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="sale : ${sales.content}">
                            <td class="ps-4">
                                <h6 class="mb-0 fw-bold" th:text="${sale.invoiceNumber}">-</h6>
                            </td>
                            <td th:text="${sale.customer.name}">Customer Name</td>
                            <td th:text="${#numbers.formatDecimal(sale.totalAmount, 0, 'COMMA', 2, 'POINT')}">-</td>
                            <td>
                               <span class="badge"
                                     th:classappend="${sale.status == 'COMPLETED' ? 'bg-success-subtle text-success' : (sale.status == 'PENDING' ? 'bg-warning-subtle text-warning' : 'bg-secondary text-white')}"
                                     th:text="${sale.status}">-</span>
                            </td>
                            <td th:text="${#temporals.format(sale.createdAt, 'dd-MM-yyyy HH:mm')}">-</td>
                            <td class="text-end pe-4">
                                <a th:href="@{/sales/view/{id}(id=${sale.id})}"
                                   class="btn btn-sm btn-light text-primary" title="View Details"
                                   data-bs-toggle="tooltip">
                                    <i class="bi bi-eye"></i>
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${sales.empty}">
                            <td colspan="6" class="text-center py-5 text-muted">
                                <i class="bi bi-cart-x display-4 mb-3 d-block"></i>
                                No sales found matching your criteria.
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <!--Pagination-->
                <div th:replace="~{fragments/pagination :: pagination(pagedData=${sales},baseUrl='/sales',label='sales')}"></div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
